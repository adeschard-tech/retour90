<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>RETOUR90 — mesures (page technique)</title>
<link rel="stylesheet" href="assets/r90.css?v=df52b875">
<style>
  body{padding:16px 12px 70px}
  h1{font-family:var(--display);font-size:28px;margin:0 0 4px}
  h1 b{color:var(--mag)}
  .intro{color:#DCD2F5;font-size:15px;margin:0 0 20px}
  section{border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 16px;
    background:rgba(255,255,255,.03)}
  h2{font-family:var(--display);font-size:18px;letter-spacing:.04em;color:var(--cyan);margin:0 0 10px}
  table{width:100%;border-collapse:collapse;font:13px/1.5 var(--mono)}
  td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
  td:first-child{color:var(--dim)}
  td:last-child{text-align:right;font-weight:bold}
  .bon{color:var(--lime)} .mauvais{color:#FF6B6B}
  .verdict{display:flex;gap:8px;margin-top:14px}
  .verdict button{flex:1;min-height:46px;border:0;border-radius:9px;font:700 15px/1 Arial,sans-serif;color:#0D0918}
  .oui{background:var(--lime)} .non{background:#FF6B6B}
  .verdict button.pris{outline:3px solid #fff;outline-offset:2px}
  #rapport{width:100%;min-height:200px;background:#07050F;color:var(--lime);border:1px solid var(--line);
    border-radius:10px;padding:12px;font:12px/1.5 var(--mono);white-space:pre}
  .copier{width:100%;min-height:50px;margin-top:10px;background:var(--cyan);color:#062320;border:0;
    border-radius:10px;font:700 16px/1 Arial,sans-serif}
</style>
</head>
<body>

<h1>RETOUR<b>90</b> · mesures</h1>
<p class="intro">Cette page mesure la hauteur réelle des écrans sur ton téléphone. Si
une hauteur vaut zéro, on tient le coupable. Regarde le poste ci-dessous : vois-tu une
image, ou seulement le caisson ?</p>

<section>
  <h2>Le poste, tel quel</h2>
  <div class="tv"><div class="tv-shell on">
    <div class="tv-screen">
      <iframe src="https://www.youtube-nocookie.com/embed/Oth_GJYdzgs?rel=0&playsinline=1"
        title="essai" allow="encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </div>
    <div class="tv-side"><div class="tv-led"></div><div class="tv-speaker"></div>
      <div class="tv-badge">RETOUR90 · CRT-2000</div></div>
  </div></div>
  <div class="verdict"><button class="oui" data-t="image">Je vois l'image</button>
    <button class="non" data-t="image">Je ne vois que le caisson</button></div>
</section>

<section>
  <h2>Les mesures</h2>
  <table id="mesures"></table>
</section>

<section>
  <h2>Le rapport</h2>
  <textarea id="rapport" readonly></textarea>
  <button class="copier" id="copier">Copier le rapport</button>
</section>

<script>
const L=[];
const dire=(k,v)=>{L.push(k+' : '+v);document.getElementById('rapport').value=L.join('\n')};

dire('date',new Date().toISOString());
dire('navigateur',navigator.userAgent);
dire('fenetre',innerWidth+'x'+innerHeight+' dpr '+devicePixelRatio);
dire('aspect-ratio reconnu',CSS.supports('aspect-ratio','16/9')?'oui':'NON');
dire('cale interne actif',CSS.supports('padding-top','56.25%')?'oui':'non');

const lignes=[];
function mesurer(nom,sel,attendu){
  const e=document.querySelector(sel);
  if(!e){lignes.push([nom,'absent',null]);dire('hauteur '+nom,'element absent');return}
  const b=e.getBoundingClientRect();
  const h=Math.round(b.height),w=Math.round(b.width);
  const ok=attendu?h>attendu:h>0;
  lignes.push([nom,w+' x '+h,ok]);
  dire('hauteur '+nom,w+'x'+h+(ok?' ok':'  <<< PROBLEME'));
}

addEventListener('load',()=>setTimeout(()=>{
  mesurer('ecran du poste','.tv-screen',40);
  mesurer('iframe du poste','.tv-screen iframe',40);
  mesurer('caisson','.tv-shell',60);
  const t=document.getElementById('mesures');
  t.innerHTML=lignes.map(l=>'<tr><td>'+l[0]+'</td><td class="'+(l[2]===null?'':l[2]?'bon':'mauvais')+'">'
    +l[1]+(l[2]===null?'':l[2]?' ok':' zero')+'</td></tr>').join('');
},1200));

document.querySelectorAll('.verdict button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.verdict button').forEach(x=>x.classList.remove('pris'));
  b.classList.add('pris');
  dire('VERDICT visuel',b.classList.contains('oui')?'image visible':'caisson seul, pas d image');
});

document.getElementById('copier').onclick=async()=>{
  const t=document.getElementById('rapport');
  try{await navigator.clipboard.writeText(t.value)}catch(e){t.select();document.execCommand('copy')}
  document.getElementById('copier').textContent='Copié';
};
</script>
</body>
</html>
